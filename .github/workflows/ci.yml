name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (DictationCore library + DictationApp executable)
        run: swift build

      - name: Test
        run: swift test
